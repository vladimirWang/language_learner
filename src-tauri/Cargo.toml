[package]
name = "word-adventure"
version = "0.1.0"
description = "A kid-friendly English vocabulary adventure game"
authors = ["you"]
edition = "2021"

[lib]
name = "word_adventure_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"
